name: Java 17 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java17-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java17-build:
    name: Java 17 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Temurin 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          check-latest: false

      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Validate Gradle wrapper
        shell: bash
        run: ./gradlew --version --no-daemon

      - name: Scan source and fixtures before build
        id: source-scan
        shell: bash
        run: ./gradlew :release-verification:sourceSecretScan --no-daemon

      - name: Build all Java 17 shards
        shell: bash
        run: ./gradlew clean build --no-daemon

      - name: Run runtime redaction canary and release artifact audit
        shell: bash
        run: >-
          ./gradlew :release-verification:runtimeCanaryAcceptance
          :release-verification:releaseArtifactAudit --no-daemon

      - name: Run logical-server lifecycle shard
        shell: bash
        run: >-
          ./gradlew :fabric-1.20.1:test --no-daemon
          --tests io.github.melswg.worldmind.fabric.WorldmindFabricServerLifecycleTest

      - name: Inspect remapped Fabric artifact
        shell: bash
        env:
          WORLDMIND_REMAPPED_JAR: ${{ github.workspace }}/fabric-1.20.1/build/libs/worldmind-fabric-1.20.1-0.1.0-SNAPSHOT.jar
        run: >-
          ./gradlew :fabric-1.20.1:test --no-daemon
          --tests io.github.melswg.worldmind.fabric.FabricArtifactPackagingTest

      - name: Scan generated reports and release outputs
        id: generated-scan
        if: always()
        shell: bash
        run: ./gradlew :release-verification:generatedOutputSecretScan --no-daemon

      - name: Upload sanitized release audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worldmind-release-audit-${{ matrix.os }}-${{ github.sha }}
          path: release-verification/build/reports/release-verification/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload raw test reports after scan
        if: always() && steps.generated-scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worldmind-test-reports-${{ matrix.os }}-${{ github.sha }}
          path: '**/build/reports/tests/**'
          if-no-files-found: warn
          retention-days: 7

      - name: Upload remapped artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worldmind-remapped-${{ matrix.os }}-${{ github.sha }}
          path: fabric-1.20.1/build/libs/worldmind-fabric-1.20.1-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

  ci-gate:
    name: CI gate
    if: always()
    needs: java17-build
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform build
        shell: bash
        run: test '${{ needs.java17-build.result }}' = success
