name: Worldmind release

# Tag-only publication gate. A release can be published only by a pushed
# annotated semantic version tag; manual dispatch is a safe dry run only and
# can never receive publication permissions.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Tag preflight
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout with tag history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Fetch annotated tag and origin/main
        shell: bash
        run: |
          git fetch --tags --force origin
          git fetch origin main

      - name: Set up Temurin 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          check-latest: false

      - name: Reject any tag that does not satisfy every preflight rule
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ./gradlew :release-verification:releaseTagPreflight \
            -PreleaseTag="${RELEASE_TAG}" \
            -PreleaseVersion="${RELEASE_TAG#v}" --no-daemon

  verify:
    name: Verify dry-run release
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.preflight.result == 'success')
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Temurin 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          check-latest: false

      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
        with:
          cache-read-only: true

      - name: Resolve dry-run release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.1.0" >> "$GITHUB_OUTPUT"
            echo "version=0.1.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Clean deterministic release dry run
        shell: bash
        run: >-
          ./gradlew clean releaseDryRun
          -PreleaseVersion="${{ steps.version.outputs.version }}"
          -PreleaseTag="${{ steps.version.outputs.tag }}" --no-daemon

      - name: Verify release workflow contract
        shell: bash
        run: ./gradlew :release-verification:releaseWorkflowContract --no-daemon

      - name: Upload short-lived safe dry-run assets
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worldmind-release-assets-${{ github.sha }}
          path: build/release/${{ steps.version.outputs.version }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Worldmind release
    needs: [preflight, verify]
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.preflight.result == 'success' &&
      needs.verify.result == 'success' &&
      vars.WORLDMIND_RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download verified dry-run assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: worldmind-release-assets-${{ github.sha }}
          path: release-assets

      - name: Resolve release version
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Reject anything outside the public allowlist
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c SHA256SUMS
          mapfile -t actual < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          expected=(
            "SHA256SUMS"
            "worldmind-fabric-1.20.1-${RELEASE_VERSION}.jar"
            "worldmind-game-context-api-${RELEASE_VERSION}-sources.jar"
            "worldmind-game-context-api-${RELEASE_VERSION}.jar"
            "worldmind-v${RELEASE_VERSION}-release-metadata.json"
          )
          expected_sorted=($(printf '%s\n' "${expected[@]}" | sort))
          if [[ "${#actual[@]}" -ne "${#expected_sorted[@]}" ]]; then
            echo "Rejected: unexpected asset count" >&2
            exit 1
          fi
          for index in "${!actual[@]}"; do
            if [[ "${actual[$index]}" != "${expected_sorted[$index]}" ]]; then
              echo "Rejected: unexpected asset ${actual[$index]}" >&2
              exit 1
            fi
          done

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" --draft
          --title "Worldmind ${GITHUB_REF_NAME}"
          --notes-file "docs/releases/v${RELEASE_VERSION}.md"

      - name: Upload allowlisted assets to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber

      - name: Confirm every allowlisted asset is present
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for asset in \
            "worldmind-fabric-1.20.1-${RELEASE_VERSION}.jar" \
            "worldmind-game-context-api-${RELEASE_VERSION}-sources.jar" \
            "worldmind-game-context-api-${RELEASE_VERSION}.jar" \
            "worldmind-v${RELEASE_VERSION}-release-metadata.json" \
            "SHA256SUMS"; do
            if ! gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | grep -Fxq "${asset}"; then
              echo "Missing asset ${asset}" >&2
              exit 1
            fi
          done

      - name: Attest build provenance for public JAR assets
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: release-assets/*.jar

      - name: Publish release (final step)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
